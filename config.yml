# Path profiles. Select with env var R_CONFIG_ACTIVE (default = local PC).
# Usage in R: cfg <- get_cfg()  (R/utils_config.R)
# Machine-specific paths (values "LOCAL" below) go in the untracked config.local.yml,
# merged over this file by get_cfg(); template: config.local.yml.example.

default:
  icos_l2_dir: "data/raw/icos_l2"          # contains XX-Yyy_output_L2I_2026/ folders
  ffp_code_dir: "legacy"                   # Kljun FFP R code (local only, gitignored; spec 08)
  # ERA5 (C. Trotta, Oct 2026). {site} = station code, e.g. BE-Bra; {var} = static variable (z, lsm, sdor)
  era5_sl_dir: "data/raw/era5/{site}"                  # hourly single levels
  era5_pl_dir: "data/raw/era5_pressure_levels/{site}"  # 6-hourly pressure levels
  era5_static_dir: "data/raw/era5_single_levels"       # static fields, all stations and variables in one folder
  target_areas_dir: "data/raw/target_areas"
  cleanset_file: "data/{site}_cleanset.csv" # ETC cleanset (local diagnostic, spec 03; optional, never committed)
  cloudnet_dir: "data/raw/cloudnet/{site}"   # ACTRIS/Cloudnet daily files (spec 07); {site} = ICOS station code
  measured_dir: "data/raw/measured/{site}"   # measured PBLH from PIs / providers (spec 10: SIRTA ReOBS zip for FR-Gri)
  standard_dir: "data/standard"
  derived_dir: "data/derived"
  output_dir: "output"
  sites_file: "config/sites.csv"
  measured_sites_file: "config/measured_sites.csv"   # ICOS site x measured PBLH source (spec 07)
  sites_timevarying_file: "config/sites_timevarying.csv"
  exclusions_file: "config/exclusion_periods.csv"
  test_sites: ["BE-Bra"]

cluster:
  icos_l2_dir: "LOCAL"
  ffp_code_dir: "LOCAL"
  era5_sl_dir: "LOCAL"
  era5_pl_dir: "LOCAL"
  era5_static_dir: "LOCAL"   # one folder per variable: path ending in {var}
  target_areas_dir: "TODO"
  cloudnet_dir: "LOCAL"
  measured_dir: "LOCAL"
  standard_dir: "TODO"
  derived_dir: "TODO"
  output_dir: "TODO"
  sites_file: "config/sites.csv"
  measured_sites_file: "config/measured_sites.csv"   # ICOS site x measured PBLH source (spec 07)
  sites_timevarying_file: "config/sites_timevarying.csv"
  exclusions_file: "config/exclusion_periods.csv"
  test_sites: ~
